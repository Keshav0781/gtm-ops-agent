# ============================================
# GTM Ops Agent - Docker Compose
# Local development environment
# Starts API + n8n + PostgreSQL together
# Same concept as Siemens local dev setup
# ============================================

version: '3.8'

services:

  # ==========================================
  # Service 1 — Our FastAPI Application
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtm-ops-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=development
    volumes:
      # Mount code for live reload in development
      # Same approach Siemens uses locally
      - .:/app
    depends_on:
      - postgres
    networks:
      - gtm-network
    restart: unless-stopped

  # ==========================================
  # Service 2 — n8n Workflow Automation
  # ==========================================
  n8n:
    image: n8nio/n8n:latest
    container_name: gtm-ops-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      # Connect n8n to our API
      - GTM_API_URL=http://api:8000
    volumes:
      # Store n8n data and workflows persistently
      - n8n_data:/home/node/.n8n
      # Mount our workflow JSONs
      - ./n8n/workflows:/home/node/.n8n/workflows
    depends_on:
      - postgres
    networks:
      - gtm-network
    restart: unless-stopped

  # ==========================================
  # Service 3 — PostgreSQL Database
  # Local alternative to Supabase
  # Same PostgreSQL engine underneath
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: gtm-ops-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=gtmuser
      - POSTGRES_PASSWORD=gtmpassword
      - POSTGRES_DB=gtmops
    volumes:
      # Persist database data between restarts
      - postgres_data:/var/lib/postgresql/data
      # Run schema on first startup
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - gtm-network
    restart: unless-stopped

# ==========================================
# Volumes — Persistent Storage
# Data survives container restarts
# ==========================================
volumes:
  postgres_data:
  n8n_data:

# ==========================================
# Networks — Internal Communication
# Services talk to each other securely
# ==========================================
networks:
  gtm-network:
    driver: bridge