# GTM Ops Agent - Docker Compose
# Local development environment
# Starts API + n8n + PostgreSQL together
# Same concept as Siemens local dev setup

services:

  # ==========================================
  # Service 1 — Our FastAPI Application
  # ==========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtm-ops-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=development
    volumes:
      - .:/app
    depends_on:
      - postgres
    networks:
      - gtm-network
    restart: unless-stopped

  # ==========================================
  # Service 2 — n8n Workflow Automation
  # ==========================================
  n8n:
    image: n8nio/n8n:latest
    container_name: gtm-ops-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - GTM_API_URL=http://host.docker.internal:8000
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/.n8n/workflows
    networks:
      - gtm-network
    restart: unless-stopped

  # ==========================================
  # Service 3 — PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: gtm-ops-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=gtmuser
      - POSTGRES_PASSWORD=gtmpassword
      - POSTGRES_DB=gtmops
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - gtm-network
    restart: unless-stopped

volumes:
  postgres_data:
  n8n_data:

networks:
  gtm-network:
    driver: bridge